name: isa-tests

on:
  push:
  pull_request:

jobs:
  rv64ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator & RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
          verilator --version
          # Install the GNU RISC-V cross toolchain (provides riscv64-unknown-elf-gcc)
          sudo apt-get install -y gcc-riscv64-unknown-elf
          riscv64-unknown-elf-gcc --version

      - name: Fetch riscv-tests ISA sources
        run: |
          git clone --depth 1 https://github.com/riscv-software-src/riscv-tests.git /tmp/riscv-tests
          ls /tmp/riscv-tests/isa/rv64ui | head

      - name: Build Verilator simulator
        run: |
          cd sim/verilator
          make

      - name: Run rv64ui ISA regression
        run: |
          cd sim/riscv-tests
          make isa RISCV_SRC=/tmp/riscv-tests/isa
