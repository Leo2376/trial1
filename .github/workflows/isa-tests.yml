name: isa-tests

on:
  push:
  pull_request:

# Pinned riscv-tests revision: floating master already drifted under us
# once (rv64ua-only, harmless). This SHA is the exact revision the repo
# is green against; bump deliberately after a local full green run.
env:
  RISCV_TESTS_REV: 87b04f07a51f57b134a935c6157222bbd35905d9

jobs:
  isa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ext: [rv64ui, rv64um, rv64uf, rv64ud, rv64uc, rv64ua]
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator & RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator gcc-riscv64-unknown-elf
          verilator --version
          riscv64-unknown-elf-gcc --version

      - name: Fetch riscv-tests ISA sources (pinned)
        run: |
          git init /tmp/riscv-tests && cd /tmp/riscv-tests
          git remote add origin https://github.com/riscv-software-src/riscv-tests.git
          git fetch --depth 1 origin "$RISCV_TESTS_REV" && git checkout "$RISCV_TESTS_REV"
          git log -1 --format="%H %ad"
          ls /tmp/riscv-tests/isa/${{ matrix.ext }} | head

      - name: Build Verilator simulator
        run: |
          cd sim/verilator
          make

      - name: Run ${{ matrix.ext }} ISA regression
        run: |
          EXT=${{ matrix.ext }} RISCV_SRC=/tmp/riscv-tests/isa ./tools/scripts/run_isa_tests.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator & RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator gcc-riscv64-unknown-elf
          verilator --version

      - name: Build Verilator simulator
        run: |
          cd sim/verilator
          make

      - name: Run FPU unit testbench
        run: |
          cd sim/verilator && make fpu      # 79/79 PASS

      - name: Run decompressor unit testbench
        run: |
          cd sim/verilator && make decomp   # 44/44 PASS

  directed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator & RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator gcc-riscv64-unknown-elf
          verilator --version
          riscv64-unknown-elf-gcc --version

      - name: Build Verilator simulator
        run: |
          cd sim/verilator
          make

      - name: Run directed core tests
        run: |
          ./tools/scripts/run_directed_tests.sh   # 10/10 PASS
