# GitLab CI for the rv64gch RISC-V project.
#
# Two stages mirroring the GitHub Actions workflows:
#   - sim:       build the Verilator testbench and run the smoke test.
#   - isa-tests: cross-compile the riscv-tests rv64ui subset and run it
#                under the simulator.
#
# The runner image is Debian based so the apt packages match the GitHub
# CI (verilator, gcc-riscv64-unknown-elf). On a self-hosted runner that
# already provides the tools, set VERILATOR_SKIP_INSTALL=1 to skip the
# apt install step.

stages:
  - build
  - test

variables:
  GIT_DEPTH: "1"
  RISCV_TESTS_REPO: "https://github.com/riscv-software-src/riscv-tests.git"
  RISCV_TESTS_DIR: "/tmp/riscv-tests"

# ---- Stage: build -----------------------------------------------------------
# Build the Verilator testbench and run the smoke test. Fails if the
# simulation does not report TEST PASSED.
sim:
  stage: build
  image: debian:bookworm
  before_script:
    - |
      if [ -z "${VERILATOR_SKIP_INSTALL:-}" ]; then
        apt-get update -y
        apt-get install -y verilator python3 make git
      fi
    - verilator --version
  script:
    - cd sim/verilator
    - make clean
    - make
    - ./obj_dir/Vtb_rv64gch_core | tee sim_smoke.log
    - grep -q "TEST PASSED" sim_smoke.log || { echo "smoke simulation did not report TEST PASSED"; exit 1; }
  artifacts:
    when: always
    paths:
      - sim/verilator/sim_smoke.log
    expire_in: 1 week

# ---- Stage: test ------------------------------------------------------------
# Cross-compile the riscv-tests rv64ui subset and run it under the
# simulator. Gated on the sim job so the smoke test must pass first; the
# simulator is rebuilt here so the binary matches the runner host.
isa-tests:
  stage: test
  image: debian:bookworm
  needs:
    - sim
  before_script:
    - |
      apt-get update -y
      apt-get install -y verilator python3 make git gcc-riscv64-unknown-elf
    - verilator --version
    - riscv64-unknown-elf-gcc --version
  script:
    # Fetch the riscv-tests ISA sources (shallow clone, no submodules).
    - git clone --depth 1 "$RISCV_TESTS_REPO" "$RISCV_TESTS_DIR"
    - ls "$RISCV_TESTS_DIR/isa/rv64ui" | head
    # Rebuild the simulator (the binary is not passed as an artifact so it
    # always matches the runner host toolchain/libc).
    - cd sim/verilator && make && cd "$CI_PROJECT_DIR"
    # Run the rv64ui regression.
    - cd sim/riscv-tests
    - make isa RISCV_SRC="$RISCV_TESTS_DIR/isa" | tee isa_rv64ui.log
    - grep -q "ALL ISA TESTS PASSED" isa_rv64ui.log || { echo "ISA regression failed"; exit 1; }
  artifacts:
    when: always
    paths:
      - sim/riscv-tests/isa_rv64ui.log
    expire_in: 1 week
